name: Update announcement feed

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: update-announcement-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
    steps:
      - name: Check feed configuration
        id: configuration
        shell: bash
        run: |
          if [[ -n "${X_BEARER_TOKEN:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "X_BEARER_TOKEN is not configured; keeping the existing feed"
          fi
      - uses: actions/checkout@v4
        if: steps.configuration.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.configuration.outputs.configured == 'true'
        with:
          node-version: 20
      - name: Fetch public announcements
        if: steps.configuration.outputs.configured == 'true'
        run: node scripts/update-announcements.mjs
      - name: Commit changed feed
        if: steps.configuration.outputs.configured == 'true'
        shell: bash
        run: |
          if git diff --quiet -- feed/announcements.json; then
            echo "Feed unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/announcements.json
          git commit -m "Update announcement feed"
          git push
